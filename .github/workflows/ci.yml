name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Read-only guard
        run: scripts/check-readonly.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install socat
        # Bounded so a slow package mirror fails fast instead of hanging the job.
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y socat
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage floor (80%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          echo "statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 80) }' || { echo "coverage below 80%" >&2; exit 1; }
      - name: Fuzz (short)
        run: |
          go test ./internal/codec -run '^$' -fuzz '^FuzzDecodeTCP$' -fuzztime 30s
          go test ./internal/codec -run '^$' -fuzz '^FuzzDecodeRTU$' -fuzztime 30s
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Every commit of the pull request must carry a Developer Certificate
          # of Origin sign-off (git commit -s). See CONTRIBUTING.md.
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -q '[^[:space:]]'; then
              echo "::error::commit $c has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in amd64 arm64 arm; do
            GOOS=linux GOARCH="$target" GOARM=7 \
              go build -trimpath -ldflags "-s -w -X main.version=ci" \
              -o "dist/modtop-linux-$target" ./cmd/modtop
          done
          ls -l dist
      - name: Clean machine
        run: |
          go build -o simserver ./internal/sim/cmd/simserver
          ./simserver -addr 127.0.0.1:1502 &
          sleep 1
          export HOME="$(mktemp -d)"
          bin=./dist/modtop-linux-amd64
          "$bin" --help > /dev/null
          "$bin" --version
          (sleep 3; printf q) | TERM=xterm script -qec "stty cols 80 rows 24; $bin 127.0.0.1:1502 -r 40001-40004" /dev/null > clean.out
          grep -q 0x4248 clean.out
