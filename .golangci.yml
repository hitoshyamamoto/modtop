version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
  settings:
    gosec:
      excludes:
        # Integer truncation is intended in a binary protocol codec
        # (splitting registers into bytes, two's complement reinterpretation).
        - G115
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
